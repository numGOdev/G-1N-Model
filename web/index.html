<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G-1N Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{padding:18px;background:#131b30;border-bottom:1px solid #293653;font-size:21px;font-weight:bold}header b{color:#8b9aff}
main{width:min(850px,100%);padding:18px;margin:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.card{background:#141e34;border:1px solid #2b3958;border-radius:15px;padding:16px}
#status{color:#aab8d8;font-size:13px}.log{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;min-height:180px}
textarea{width:100%;min-height:90px;background:#0d1528;color:white;border:1px solid #354363;border-radius:10px;padding:12px;font:inherit}
button{background:#7789ff;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:bold;margin-top:10px}small{color:#aab8d8}h2{margin-top:0}
</style></head><body><header>⚡ G-<b>1N</b> · Model Lab</header><main>
<section class="card"><h2>Model status</h2><div id="status">Checking…</div></section>
<section class="card"><h2>Generate text</h2><textarea id="prompt" placeholder="Type a prompt…"></textarea><button id="go">Generate</button><div class="log" id="out">Train G-1N first. An untrained model will not produce meaningful language.</div></section>
<section class="card"><small>G-1N is a small decoder-only Transformer trained from random initialization. It does not use Qwen or other pretrained model weights.</small></section>
</main><script>
async function status(){try{const r=await fetch('/api/status');const d=await r.json();document.getElementById('status').textContent=d.message}catch(e){document.getElementById('status').textContent='Backend offline'}}
document.getElementById('go').onclick=async()=>{const p=document.getElementById('prompt').value;const o=document.getElementById('out');o.textContent='Generating…';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,tokens:120})});const d=await r.json();o.textContent=r.ok?d.text:d.error}catch(e){o.textContent='Could not reach the Python server.'}};
status();
</script></body></html>
